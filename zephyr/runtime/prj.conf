# SPDX-License-Identifier: MPL-2.0
### Direct-boot runtime baseline
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_ROM_START_OFFSET=0
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

### Runtime console / serial baseline
CONFIG_SERIAL=y
CONFIG_MULTITHREADING=y
CONFIG_EVENTS=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_ASYNC=n
CONFIG_LOG_BACKEND_UART_BUFFER_SIZE=256
CONFIG_USE_SEGGER_RTT=n

# Runtime Serial.printf(), RTT printk, and logging support floating-point formats.
CONFIG_CBPRINTF_FP_SUPPORT=y

### Application component slot
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_REBOOT=y

### RTBus baseline modules
CONFIG_RTBUS_LIB=y
CONFIG_RTBUS_NATIVE_SERVICE=y
CONFIG_RTBUS_IMAGE_RAM_MAX=8192
CONFIG_RUNTIME_POOL_SIZE=4096

### Downstream transports/features are provided by optional modules and overlays.
CONFIG_BT=n

CONFIG_BUILD_OUTPUT_META=y
