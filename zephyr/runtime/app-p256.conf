# SPDX-License-Identifier: MPL-2.0
# Merge with the selected board configuration. Configure PSA independently of
# RTBus service dependencies to avoid reverse-select Kconfig cycles.
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_RTBUS_IMAGE_VERIFY_P256=y

# Initial ECDSA workspace budget, separate from application/system heap.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=2
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
