# SPDX-License-Identifier: MPL-2.0

# Reserve USART2 for native Serial and the RTBus CLI.
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n

# Omit RTT and the Zephyr logger on this SRAM-constrained profile.
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG=n

CONFIG_MAIN_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_RUNTIME_POOL_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_NVS=y

CONFIG_RTBUS_IMAGE_RAM_MAX=1024
CONFIG_RTBUS_NATIVE_EVENT_QUEUE_DEPTH=3
CONFIG_RTBUS_NATIVE_API_TABLE_BASE=0x20004F00
CONFIG_RTBUS_IMAGE_ALLOW_UNVERIFIED=y
