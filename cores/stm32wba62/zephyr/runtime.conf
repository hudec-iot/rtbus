# SPDX-License-Identifier: MPL-2.0

# Keep USART1 available for the native application and the RTBus CLI.
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_NVS=y
# The upstream 56 KiB storage partition contains seven 8 KiB erase pages.
CONFIG_SETTINGS_NVS_SECTOR_COUNT=7

CONFIG_RTBUS_IMAGE_RAM_MAX=8192
CONFIG_RTBUS_NATIVE_API_TABLE_BASE=0x2006FF00
