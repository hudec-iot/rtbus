# SPDX-License-Identifier: MPL-2.0
name: CI Arduino Package Release
run-name: Arduino package release - ${{ github.event.client_payload.request_id }}

on:
  repository_dispatch:
    types: [rtbus-arduino-release]

permissions:
  contents: write

# Serialize fetching and replacing the shared index across release requests.
concurrency:
  group: arduino-package-index-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'hudec-iot/rtbus' && github.event.client_payload.source_repository == 'hudec-iot/rtbus-internal'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ github.event.client_payload.public_sha }}
          persist-credentials: false

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -eu
          version="$(sed -n '1{s/[[:space:]]//g;p;q;}' .version)"
          tag="v${version}"

          case "${version}" in
            ""|v*)
              echo "Invalid release version: ${version}" >&2
              exit 1
              ;;
          esac

          if [[ ! "${version}" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build Arduino package
        id: package
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ARDUINO_JLINK_WINDOWS_URL: ${{ vars.JLINK_WINDOWS_URL }}
          ARDUINO_JLINK_WINDOWS_SHA256: ${{ vars.JLINK_WINDOWS_SHA256 }}
          ARDUINO_JLINK_WINDOWS_SIZE: ${{ vars.JLINK_WINDOWS_SIZE }}
          ARDUINO_JLINK_VERSION: ${{ vars.JLINK_VERSION || '9.70' }}
          ARDUINO_JLINK_WINDOWS_ARCHIVE: ${{ vars.JLINK_WINDOWS_ARCHIVE || 'jlink-9.70-windows-x86_64.zip' }}
        shell: bash
        run: |
          set -eu

          : "${ARDUINO_JLINK_WINDOWS_URL:?Set JLINK_WINDOWS_URL to a portable Windows client archive URL}"
          : "${ARDUINO_JLINK_WINDOWS_SHA256:?Set JLINK_WINDOWS_SHA256}"
          : "${ARDUINO_JLINK_WINDOWS_SIZE:?Set JLINK_WINDOWS_SIZE in bytes}"

          make -C tools/scripts package \
            ARDUINO_RELEASE_VERSION="${VERSION}" \
            ARDUINO_PREVIOUS_INDEX_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/package-index/package_rtbus_index.json" \
            ARDUINO_PACKAGE_BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}"

          package_archive="dist/arduino/rtduo-${VERSION}.tar.gz"
          package_index="dist/arduino/package_rtbus_index.json"

          test -s "${package_archive}"
          test -s "${package_index}"

          echo "archive=${package_archive}" >> "${GITHUB_OUTPUT}"
          echo "index=${package_index}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_COMMITISH: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: |
          set -eu

          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already exists for ${TAG_NAME}" >&2
            exit 1
          fi

          gh release create "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET_COMMITISH}" \
            --title "RTBus ${VERSION}" \
            --notes "RTBus Arduino package release ${VERSION}. Platform source: https://github.com/${GITHUB_REPOSITORY}/tree/${TARGET_COMMITISH}. See SOURCE_INFO.md and THIRD_PARTY_NOTICES.md in the SDK for firmware provenance and upstream licenses."

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          PACKAGE_ARCHIVE: ${{ steps.package.outputs.archive }}
        shell: bash
        run: |
          set -eu

          gh release upload "${TAG_NAME}" \
            "${PACKAGE_ARCHIVE}" \
            --repo "${GITHUB_REPOSITORY}"

      - name: Publish package index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_INDEX: ${{ steps.package.outputs.index }}
        shell: bash
        run: |
          set -eu

          index_tag="package-index"

          if ! gh release view "${index_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${index_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Arduino Package Index" \
              --notes "Stable Arduino Boards Manager package index." \
              --latest=false
          fi

          gh release upload "${index_tag}" \
            "${PACKAGE_INDEX}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
