name: CI Arduino Package Release
run-name: Arduino package release - ${{ github.event.client_payload.request_id }}

on:
  repository_dispatch:
    types: [rtbus-arduino-release]

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'hudec-iot/rtbus' && github.event.client_payload.source_repository == 'hudec-iot/rtbus-private'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ github.event.client_payload.public_sha }}
          persist-credentials: false

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -eu
          version="$(sed -n '1{s/[[:space:]]//g;p;q;}' .version)"
          tag="v${version}"

          case "${version}" in
            ""|v*)
              echo "Invalid release version: ${version}" >&2
              exit 1
              ;;
          esac

          if [[ ! "${version}" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build Arduino package
        id: package
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -eu

          python3 scripts/package_arduino.py \
            --output-dir dist/arduino \
            --index-file package_rtbus_index.json \
            --version "${VERSION}" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}"

          package_archive="dist/arduino/rtduo-${VERSION}.tar.gz"
          package_index="dist/arduino/package_rtbus_index.json"

          test -s "${package_archive}"
          test -s "${package_index}"

          echo "archive=${package_archive}" >> "${GITHUB_OUTPUT}"
          echo "index=${package_index}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_COMMITISH: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: |
          set -eu

          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already exists for ${TAG_NAME}" >&2
            exit 1
          fi

          gh release create "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET_COMMITISH}" \
            --title "RTBus ${VERSION}" \
            --notes "RTBus Arduino package release ${VERSION}."

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          PACKAGE_ARCHIVE: ${{ steps.package.outputs.archive }}
        shell: bash
        run: |
          set -eu

          gh release upload "${TAG_NAME}" \
            "${PACKAGE_ARCHIVE}" \
            --repo "${GITHUB_REPOSITORY}"

      - name: Publish package index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_INDEX: ${{ steps.package.outputs.index }}
        shell: bash
        run: |
          set -eu

          index_tag="package-index"

          if ! gh release view "${index_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${index_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Arduino Package Index" \
              --notes "Stable Arduino Boards Manager package index." \
              --latest=false
          fi

          gh release upload "${index_tag}" \
            "${PACKAGE_INDEX}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
