name: CI Build and push RTBus builder image

on:
  repository_dispatch:
    types: [rtbus-builder-publish]

permissions:
  contents: read
  packages: write

concurrency:
  group: rtbus-builder-${{ github.repository }}-${{ github.event.client_payload.image_tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'hudec-iot/rtbus' && github.event.client_payload.source_repository == 'hudec-iot/rtbus-private'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.client_payload.public_ref }}

      - name: Prepare image name
        shell: bash
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid container image tag: $IMAGE_TAG" >&2
            exit 1
          fi
          echo "RTBUS_IMAGE=ghcr.io/${IMAGE_OWNER,,}/rtbus-zephyr:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Build builder image
        run: make docker.build VM=docker RTBUS_BUILDER_IMAGE="$RTBUS_IMAGE"

      - name: Login to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

      - name: Push builder image
        run: docker push "$RTBUS_IMAGE"

      - name: Logout from GitHub Container Registry
        if: always()
        run: docker logout ghcr.io
