name: CI Build and push RTBus builder image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image version tag (independent of the Zephyr SDK version)'
        required: true
        default: '1.0.0'
        type: string
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: rtbus-builder-${{ github.repository }}-${{ inputs.image_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare image name
        shell: bash
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid container image tag: $IMAGE_TAG" >&2
            exit 1
          fi
          echo "RTBUS_IMAGE=ghcr.io/${IMAGE_OWNER,,}/rtbus-zephyr:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Build builder image
        run: make docker.build VM=docker RTBUS_BUILDER_IMAGE="$RTBUS_IMAGE"

      - name: Login to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

      - name: Push builder image
        run: docker push "$RTBUS_IMAGE"

      - name: Logout from GitHub Container Registry
        if: always()
        run: docker logout ghcr.io
