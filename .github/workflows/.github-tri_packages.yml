name: Trigger - CI Build and push RTBus builder image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image version tag (independent of the Zephyr SDK version)'
        required: true
        default: '1.0.0'
        type: string
      public_ref:
        description: 'Public repository branch or tag to build'
        required: true
        default: master
        type: string

permissions: {}

jobs:
  publish:
    if: github.repository == 'hudec-iot/rtbus-internal'
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Create public repository token
        id: packages-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: hudec-iot
          repositories: rtbus
          permission-contents: write

      - name: Trigger public image publication
        env:
          GH_TOKEN: ${{ steps.packages-token.outputs.token }}
          PUBLIC_REF: ${{ inputs.public_ref }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          url = "https://api.github.com/repos/hudec-iot/rtbus/dispatches"
          payload = {
              "event_type": "rtbus-builder-publish",
              "client_payload": {
                  "public_ref": os.environ["PUBLIC_REF"],
                  "image_tag": os.environ["IMAGE_TAG"],
                  "source_repository": "hudec-iot/rtbus-internal",
              },
          }
          headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2026-03-10",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Content-Type": "application/json",
              "User-Agent": "rtbus-internal-packages-trigger",
          }
          try:
              with urlopen(Request(url, data=json.dumps(payload).encode(), headers=headers), timeout=30) as response:
                  if response.status != 204:
                      raise SystemExit(f"Unexpected GitHub API status: {response.status}")
          except HTTPError as error:
              raise SystemExit(f"GitHub API returned HTTP {error.code}: {error.read().decode()}")

          workflow_url = "https://github.com/hudec-iot/rtbus/actions/workflows/.github-ci_packages.yml"
          print(f"Public image publication event accepted. Check runs: {workflow_url}", flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Dispatch accepted; check [public workflow runs]({workflow_url}) for publication status.\n")
          PY
