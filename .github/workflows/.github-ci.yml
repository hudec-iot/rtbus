# SPDX-License-Identifier: MPL-2.0
name: Test Local Runner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Show runner information
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Hello from local runner"
        make ci.github.gh GH_ARGS="--version"
        whoami
        hostname
        uname -a
        pwd
        ls -la
